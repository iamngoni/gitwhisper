name: Build and Release GitWhisper

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.asset }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          # `legacy` re-publishes the build under the pre-1.0.9 asset name so
          # older install scripts keep working.
          - asset: linux-x64
            legacy: linux
            runner: [self-hosted, Linux, X64]
            binary: gitwhisper
          - asset: linux-arm64
            runner: [self-hosted, Linux, ARM64]
            binary: gitwhisper
          - asset: macos-arm64
            legacy: macos
            runner: [self-hosted, macOS, ARM64]
            binary: gitwhisper
          - asset: macos-x64
            runner: [self-hosted, macOS, X64]
            binary: gitwhisper
          - asset: windows-x64
            legacy: windows
            runner: [self-hosted, Windows, X64]
            binary: gitwhisper.exe

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1

      - run: dart pub get

      - name: Compile binary
        run: dart compile exe bin/main.dart -o ${{ matrix.binary }}

      - name: Archive and checksum (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          archive="gitwhisper-${{ matrix.asset }}.tar.gz"
          tar -czf "$archive" "${{ matrix.binary }}"
          if [ -n "${{ matrix.legacy }}" ]; then
            cp "$archive" "gitwhisper-${{ matrix.legacy }}.tar.gz"
          fi
          for f in gitwhisper-*.tar.gz; do
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$f" > "$f.sha256"
            else
              shasum -a 256 "$f" > "$f.sha256"
            fi
          done

      - name: Archive and checksum (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = "gitwhisper-${{ matrix.asset }}.tar.gz"
          tar -czf $archive ${{ matrix.binary }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ("${{ matrix.legacy }}") {
            Copy-Item $archive "gitwhisper-${{ matrix.legacy }}.tar.gz"
          }
          Get-ChildItem gitwhisper-*.tar.gz | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            Set-Content -Path "$($_.Name).sha256" -Value "$hash  $($_.Name)" -Encoding ascii
          }

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            gitwhisper-*.tar.gz
            gitwhisper-*.tar.gz.sha256
          fail_on_unmatched_files: true

  publish-apt:
    needs: build
    runs-on: [self-hosted, Linux]
    steps:
      - name: Build and publish .deb packages
        shell: bash
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_PAT }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          cd "$work"

          for pair in amd64:linux-x64 arm64:linux-arm64; do
            deb_arch="${pair%%:*}"
            asset="gitwhisper-${pair#*:}.tar.gz"
            curl -fsSL -o "$asset" "$base/$asset"
            curl -fsSL -o "$asset.sha256" "$base/$asset.sha256"
            sha256sum -c "$asset.sha256"

            pkg="deb-$deb_arch"
            mkdir -p "$pkg/usr/local/bin" "$pkg/DEBIAN"
            tar -xzf "$asset" -C "$pkg/usr/local/bin"
            ln -sf /usr/local/bin/gitwhisper "$pkg/usr/local/bin/gw"
            printf '%s\n' \
              "Package: gitwhisper" \
              "Version: ${version}" \
              "Section: utils" \
              "Priority: optional" \
              "Architecture: ${deb_arch}" \
              "Maintainer: Ngonidzashe Mangudya <imngonii@gmail.com>" \
              "Description: AI-assisted Git commit CLI. Includes both gitwhisper and gw commands." \
              > "$pkg/DEBIAN/control"
            dpkg-deb --build --root-owner-group "$pkg" "gitwhisper_${version}_${deb_arch}.deb"
          done

          git clone --depth=1 --branch=gh-pages https://github.com/iamngoni/gitwhisper-apt apt-repo
          cd apt-repo

          mkdir -p pool/main/g/gitwhisper
          cp ../gitwhisper_"${version}"_*.deb pool/main/g/gitwhisper/

          for deb_arch in amd64 arm64; do
            mkdir -p "dists/stable/main/binary-$deb_arch"
            dpkg-scanpackages --arch "$deb_arch" pool /dev/null > "dists/stable/main/binary-$deb_arch/Packages"
            gzip -kf "dists/stable/main/binary-$deb_arch/Packages"
          done

          printf '%s\n' \
            "Origin: GitWhisper" \
            "Label: GitWhisper" \
            "Suite: stable" \
            "Codename: stable" \
            "Architectures: amd64 arm64" \
            "Components: main" \
            "Description: GitWhisper APT Repository" \
            > dists/stable/Release

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "Publish gitwhisper ${version} (amd64 and arm64)"
          git push "https://x-access-token:${TAP_TOKEN}@github.com/iamngoni/gitwhisper-apt" gh-pages

  update-homebrew:
    needs: build
    runs-on: [self-hosted, macOS]
    steps:
      - name: Update formula
        shell: bash
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_PAT }}
        run: |
          set -euo pipefail
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          cd "$work"

          for asset in macos-arm64 macos-x64 linux-arm64 linux-x64; do
            curl -fsSL -o "$asset.tar.gz" "$base/gitwhisper-$asset.tar.gz"
          done
          sum() { shasum -a 256 "$1.tar.gz" | cut -d ' ' -f1; }

          git clone https://github.com/iamngoni/homebrew-gitwhisper.git tap
          cat > tap/Formula/gitwhisper.rb <<EOF
          class Gitwhisper < Formula
            desc "AI-assisted git commit CLI"
            homepage "https://github.com/iamngoni/gitwhisper"
            version "${GITHUB_REF_NAME}"

            on_macos do
              on_arm do
                url "${base}/gitwhisper-macos-arm64.tar.gz"
                sha256 "$(sum macos-arm64)"
              end
              on_intel do
                url "${base}/gitwhisper-macos-x64.tar.gz"
                sha256 "$(sum macos-x64)"
              end
            end

            on_linux do
              on_arm do
                url "${base}/gitwhisper-linux-arm64.tar.gz"
                sha256 "$(sum linux-arm64)"
              end
              on_intel do
                url "${base}/gitwhisper-linux-x64.tar.gz"
                sha256 "$(sum linux-x64)"
              end
            end

            def install
              bin.install "gitwhisper"
              bin.install_symlink "gitwhisper" => "gw"
            end
          end
          EOF

          cd tap
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add Formula/gitwhisper.rb
          git commit -m "Update formula to ${GITHUB_REF_NAME}"
          git push "https://x-access-token:${TAP_TOKEN}@github.com/iamngoni/homebrew-gitwhisper" HEAD:main
