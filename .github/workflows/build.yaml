name: Build and Release GitWhisper

on:
  push:
    tags:
      - "v*"
  # Rebuilds an existing release tag with this version of the workflow, for
  # when a tag's own workflow can no longer build it.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, e.g. v1.0.10
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: build (${{ matrix.asset }})
    runs-on: ${{ matrix.runner }}
    strategy:
      # Let the other platforms finish and upload when one fails, so only the
      # failed build has to be re-run.
      fail-fast: false
      matrix:
        include:
          # `legacy` re-publishes the build under the pre-1.0.9 asset name so
          # older install scripts keep working.
          - asset: linux-x64
            legacy: linux
            runner: [self-hosted, Linux, X64]
            binary: gitwhisper
          - asset: linux-arm64
            runner: [self-hosted, Linux, ARM64]
            binary: gitwhisper
          - asset: macos-arm64
            legacy: macos
            runner: [self-hosted, macOS, ARM64]
            binary: gitwhisper
          - asset: windows-x64
            legacy: windows
            runner: [self-hosted, Windows, X64]
            binary: gitwhisper.exe

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        if: runner.os != 'Windows'

      # setup-dart unpacks the SDK under the runner's work directory, which is
      # deep enough on our Windows runners to push some SDK files past the
      # 260-character path limit. Install the same stable SDK into a short
      # directory instead.
      - name: Install Dart (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $curl = "$env:SystemRoot\System32\curl.exe"
          $tar = "$env:SystemRoot\System32\tar.exe"
          $channel = 'https://storage.googleapis.com/dart-archive/channels/stable/release'
          $zipName = 'dartsdk-windows-x64-release.zip'
          $root = Join-Path $env:LOCALAPPDATA "gw-dart-$($env:GITHUB_RUN_ID)-$($env:GITHUB_RUN_ATTEMPT)"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          [IO.File]::AppendAllText($env:GITHUB_ENV, "GW_DART_ROOT=$root`n")

          function Get-Url($url, $outFile) {
            & $curl -fsSL --retry 3 -o $outFile $url
            if ($LASTEXITCODE -ne 0) { throw "Download failed: $url" }
          }

          Get-Url "$channel/latest/VERSION" "$root\VERSION"
          $version = (Get-Content -Raw "$root\VERSION" | ConvertFrom-Json).version
          Get-Url "$channel/$version/sdk/$zipName" "$root\$zipName"
          Get-Url "$channel/$version/sdk/$zipName.sha256sum" "$root\$zipName.sha256sum"
          $expected = ((Get-Content -Raw "$root\$zipName.sha256sum").Trim() -split '\s+')[0].ToLower()
          $actual = (Get-FileHash "$root\$zipName" -Algorithm SHA256).Hash.ToLower()
          if ($expected -ne $actual) {
            throw "Checksum mismatch for Dart $version (expected $expected, got $actual)"
          }
          & $tar -xf "$root\$zipName" -C $root
          if ($LASTEXITCODE -ne 0) { throw "Could not extract Dart $version" }
          Remove-Item "$root\$zipName", "$root\$zipName.sha256sum", "$root\VERSION"
          [IO.File]::AppendAllText($env:GITHUB_PATH, "$root\dart-sdk\bin`n")
          Write-Host "Installed Dart $version in $root"

      - run: dart pub get

      - name: Compile binary
        run: dart compile exe bin/main.dart -o ${{ matrix.binary }}

      - name: Archive and checksum (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          archive="gitwhisper-${{ matrix.asset }}.tar.gz"
          tar -czf "$archive" "${{ matrix.binary }}"
          if [ -n "${{ matrix.legacy }}" ]; then
            cp "$archive" "gitwhisper-${{ matrix.legacy }}.tar.gz"
          fi
          for f in gitwhisper-*.tar.gz; do
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$f" > "$f.sha256"
            else
              shasum -a 256 "$f" > "$f.sha256"
            fi
          done

      # Windows PowerShell, since the Windows runners have no PowerShell 7.
      - name: Archive and checksum (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = "gitwhisper-${{ matrix.asset }}.tar.gz"
          tar -czf $archive ${{ matrix.binary }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ("${{ matrix.legacy }}") {
            Copy-Item $archive "gitwhisper-${{ matrix.legacy }}.tar.gz"
          }
          Get-ChildItem gitwhisper-*.tar.gz | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            Set-Content -Path "$($_.Name).sha256" -Value "$hash  $($_.Name)" -Encoding ascii
          }

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            gitwhisper-*.tar.gz
            gitwhisper-*.tar.gz.sha256
          fail_on_unmatched_files: true

      - name: Remove Dart (Windows)
        if: always() && runner.os == 'Windows' && env.GW_DART_ROOT != ''
        shell: powershell
        run: |
          try {
            Remove-Item -LiteralPath $env:GW_DART_ROOT -Recurse -Force
          } catch {
            Write-Warning "Could not remove $($env:GW_DART_ROOT): $_"
          }

  publish-apt:
    needs: build
    # The X64 Linux runner has dpkg-dev installed.
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Build and publish .deb packages
        shell: bash
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_PAT }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          cd "$work"

          for pair in amd64:linux-x64 arm64:linux-arm64; do
            deb_arch="${pair%%:*}"
            asset="gitwhisper-${pair#*:}.tar.gz"
            curl -fsSL -o "$asset" "$base/$asset"
            curl -fsSL -o "$asset.sha256" "$base/$asset.sha256"
            sha256sum -c "$asset.sha256"

            pkg="deb-$deb_arch"
            mkdir -p "$pkg/usr/local/bin" "$pkg/DEBIAN"
            tar -xzf "$asset" -C "$pkg/usr/local/bin"
            ln -sf /usr/local/bin/gitwhisper "$pkg/usr/local/bin/gw"
            printf '%s\n' \
              "Package: gitwhisper" \
              "Version: ${version}" \
              "Section: utils" \
              "Priority: optional" \
              "Architecture: ${deb_arch}" \
              "Maintainer: Ngonidzashe Mangudya <imngonii@gmail.com>" \
              "Description: AI-assisted Git commit CLI. Includes both gitwhisper and gw commands." \
              > "$pkg/DEBIAN/control"
            dpkg-deb --build --root-owner-group "$pkg" "gitwhisper_${version}_${deb_arch}.deb"
          done

          git clone --depth=1 --branch=gh-pages https://github.com/iamngoni/gitwhisper-apt apt-repo
          cd apt-repo

          mkdir -p pool/main/g/gitwhisper
          cp ../gitwhisper_"${version}"_*.deb pool/main/g/gitwhisper/

          for deb_arch in amd64 arm64; do
            mkdir -p "dists/stable/main/binary-$deb_arch"
            dpkg-scanpackages --arch "$deb_arch" pool /dev/null > "dists/stable/main/binary-$deb_arch/Packages"
            gzip -kf "dists/stable/main/binary-$deb_arch/Packages"
          done

          printf '%s\n' \
            "Origin: GitWhisper" \
            "Label: GitWhisper" \
            "Suite: stable" \
            "Codename: stable" \
            "Architectures: amd64 arm64" \
            "Components: main" \
            "Description: GitWhisper APT Repository" \
            > dists/stable/Release

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          if git diff --cached --quiet; then
            echo "gitwhisper ${version} is already published."
            exit 0
          fi
          git commit -m "Publish gitwhisper ${version} (amd64 and arm64)"
          git -c credential.helper= \
            -c 'credential.helper=!f() { echo username=x-access-token; echo "password=${TAP_TOKEN}"; }; f' \
            push https://github.com/iamngoni/gitwhisper-apt gh-pages

  update-homebrew:
    needs: build
    runs-on: [self-hosted, macOS]
    steps:
      - name: Update formula
        shell: bash
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_PAT }}
        run: |
          set -euo pipefail
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          cd "$work"

          git clone https://github.com/iamngoni/homebrew-gitwhisper.git tap

          # Never move the formula back to an older release, for example when
          # an older tag is rebuilt or its run finishes last.
          current=$(sed -n 's/^[[:space:]]*version "\(.*\)"$/\1/p' tap/Formula/gitwhisper.rb | head -n 1)
          newest=$(printf '%s\n%s\n' "${current#v}" "${RELEASE_TAG#v}" | sort -V | tail -n 1)
          if [[ -n "$current" && "$current" != "$RELEASE_TAG" && "$newest" == "${current#v}" ]]; then
            echo "The formula is already at $current; leaving it there instead of $RELEASE_TAG."
            exit 0
          fi

          for asset in macos-arm64 linux-arm64 linux-x64; do
            curl -fsSL -o "$asset.tar.gz" "$base/gitwhisper-$asset.tar.gz"
          done
          sum() { shasum -a 256 "$1.tar.gz" | cut -d ' ' -f1; }

          cat > tap/Formula/gitwhisper.rb <<EOF
          class Gitwhisper < Formula
            desc "AI-assisted git commit CLI"
            homepage "https://github.com/iamngoni/gitwhisper"
            version "${RELEASE_TAG}"

            on_macos do
              # There is no Intel Mac build. Intel Macs get the arm64 URL only
              # so the formula loads and this requirement can refuse them with
              # a clear message.
              depends_on arch: :arm64

              on_arm do
                url "${base}/gitwhisper-macos-arm64.tar.gz"
                sha256 "$(sum macos-arm64)"
              end
              on_intel do
                url "${base}/gitwhisper-macos-arm64.tar.gz"
                sha256 "$(sum macos-arm64)"
              end
            end

            on_linux do
              on_arm do
                url "${base}/gitwhisper-linux-arm64.tar.gz"
                sha256 "$(sum linux-arm64)"
              end
              on_intel do
                url "${base}/gitwhisper-linux-x64.tar.gz"
                sha256 "$(sum linux-x64)"
              end
            end

            def install
              bin.install "gitwhisper"
              bin.install_symlink "gitwhisper" => "gw"
            end
          end
          EOF

          cd tap
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add Formula/gitwhisper.rb
          if git diff --cached --quiet; then
            echo "The formula is already at ${RELEASE_TAG}."
            exit 0
          fi
          git commit -m "Update formula to ${RELEASE_TAG}"
          git -c credential.helper= \
            -c 'credential.helper=!f() { echo username=x-access-token; echo "password=${TAP_TOKEN}"; }; f' \
            push https://github.com/iamngoni/homebrew-gitwhisper HEAD:main
